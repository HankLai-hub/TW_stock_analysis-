name: Discord Market History

on:
  workflow_run:
    workflows: ["TW Market Radar Production Automation"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

# Discord 歷史比較一次只允許一個執行，
# 避免兩個 snapshot 同時寫入而互相衝突。
concurrency:
  group: discord-market-history
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest market data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 上一次比較基準不再放在 main。
      # 改從獨立的 discord-history-data 分支讀取。
      - name: Restore previous comparison snapshot
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin discord-history-data >/dev/null 2>&1; then
            echo "Found discord-history-data branch."

            git fetch --depth=1 origin discord-history-data

            if git cat-file -e FETCH_HEAD:last_snapshot.json 2>/dev/null; then
              mkdir -p .github/discord-history

              git show FETCH_HEAD:last_snapshot.json \
                > .github/discord-history/last_snapshot.json

              echo "Previous snapshot restored."
            fi
          else
            echo "No history branch yet."
            echo "The current snapshot will become the initial baseline."
          fi

      - name: Compare all market JSON data and publish to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python automation/discord_compare.py

      # Snapshot 與完整比較報告只寫到獨立分支。
      # 絕對不再 commit / push main。
      - name: Save comparison history to dedicated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          STATE_REPO="$(mktemp -d)"

          cd "$STATE_REPO"

          git init -q

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin discord-history-data >/dev/null 2>&1; then

            echo "Updating existing history branch."

            git fetch --depth=1 origin discord-history-data

            git checkout -B discord-history-data FETCH_HEAD

          else

            echo "Creating discord-history-data branch."

            git checkout --orphan discord-history-data

          fi

          # 儲存最新 snapshot
          cp \
            "$GITHUB_WORKSPACE/.github/discord-history/last_snapshot.json" \
            last_snapshot.json

          # 儲存本次完整比較報告
          mkdir -p reports

          LATEST_REPORT="$(
            ls -t \
              "$GITHUB_WORKSPACE"/reports/discord-history/market-comparison-*.md \
              | head -n 1
          )"

          cp "$LATEST_REPORT" reports/

          git add last_snapshot.json reports/

          if git diff --cached --quiet; then

            echo "No comparison-state changes."

          else

            git commit \
              -m "chore: update Discord comparison history [skip ci]"

            git push origin HEAD:discord-history-data

          fi