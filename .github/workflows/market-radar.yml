name: TW Market Radar Production Automation

on:
  workflow_dispatch:
    inputs:
      update_kind:
        description: "更新模式"
        required: true
        default: "afterhours"
        type: choice
        options:
          - premarket
          - intraday
          - afterhours
          - weekly
          - deploy-only
  schedule:
    # GitHub cron is UTC. Taipei = UTC+8.
    # 週一至週五 08:30 盤前
    - cron: "30 0 * * 1-5"
    # 週一至週五盤中：09:07 / 10:07 / 11:07 / 12:07 / 13:07
    - cron: "7 1-5 * * 1-5"
    # 收盤後第一輪：13:37
    - cron: "37 5 * * 1-5"
    # 盤後：15:17 / 18:17 / 21:17
    # 以及下一個台北日 00:17 / 03:17 / 06:17（UTC 仍是前一工作日）
    - cron: "17 7,10,13,16,19,22 * * 1-5"
    # 每週日 20:00 週報
    - cron: "0 12 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-market-radar-production
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INTRADAY_FEED_URL: ${{ secrets.INTRADAY_FEED_URL }}
      INTRADAY_FEED_TOKEN: ${{ secrets.INTRADAY_FEED_TOKEN }}
      INTRADAY_PUBLIC_DISPLAY: ${{ secrets.INTRADAY_PUBLIC_DISPLAY }}
      GLOBAL_EQUITY_FEED_URL: ${{ secrets.GLOBAL_EQUITY_FEED_URL }}
      GLOBAL_EQUITY_FEED_TOKEN: ${{ secrets.GLOBAL_EQUITY_FEED_TOKEN }}
      GLOBAL_EQUITY_PUBLIC_DISPLAY: ${{ secrets.GLOBAL_EQUITY_PUBLIC_DISPLAY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair TPEx TWCA certificate chain
        shell: bash
        run: |
          set -u
          echo "Checking TPEx HTTPS certificate validation..."
          if python - <<'PY'
          import urllib.request
          with urllib.request.urlopen(
              "https://www.tpex.org.tw/openapi/v1/tpex_daily_trading_index",
              timeout=20,
          ) as r:
              print("TPEx TLS already valid:", r.status)
          PY
          then
            echo "TPEx certificate chain is already trusted."
            exit 0
          fi

          echo "TPEx server chain needs a runner-local TWCA repair."
          (openssl s_client \
            -connect www.tpex.org.tw:443 \
            -servername www.tpex.org.tw \
            -showcerts </dev/null 2>/dev/null || true) \
            | awk '
              /-----BEGIN CERTIFICATE-----/ {n++}
              n==1 {print}
              /-----END CERTIFICATE-----/ && n==1 {exit}
            ' > /tmp/tpex-leaf.pem

          if [[ ! -s /tmp/tpex-leaf.pem ]]; then
            echo "::warning::TPEx leaf certificate unavailable; TPEx fields may stay stale/N/A."
            exit 0
          fi

          ISSUER_URI="$(
            openssl x509 -in /tmp/tpex-leaf.pem -noout -text \
            | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' \
            | head -n 1
          )"

          if [[ -z "${ISSUER_URI}" ]]; then
            echo "::warning::TPEx CA Issuers URI unavailable; continuing without CA repair."
            exit 0
          fi

          if ! curl -fsSL --retry 3 --retry-delay 2 "${ISSUER_URI}" -o /tmp/tpex-issuer.bin; then
            echo "::warning::Unable to download TPEx issuer; continuing without CA repair."
            exit 0
          fi

          if openssl x509 -inform DER -in /tmp/tpex-issuer.bin -noout >/dev/null 2>&1; then
            openssl x509 -inform DER -in /tmp/tpex-issuer.bin -out /tmp/tpex-issuer.pem
          elif openssl x509 -in /tmp/tpex-issuer.bin -noout >/dev/null 2>&1; then
            cp /tmp/tpex-issuer.bin /tmp/tpex-issuer.pem
          else
            echo "::warning::TPEx issuer is not a recognized X.509 certificate."
            exit 0
          fi

          SUBJECT="$(openssl x509 -in /tmp/tpex-issuer.pem -noout -subject -nameopt RFC2253)"
          ISSUER="$(openssl x509 -in /tmp/tpex-issuer.pem -noout -issuer -nameopt RFC2253)"
          ACTUAL_SHA256="$(
            openssl x509 -in /tmp/tpex-issuer.pem -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED_SHA256="01af2324d098098f5e0cdf6faabada430b21cce777f47eacb26248b2fda3e531"

          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]] || \
             [[ "${SUBJECT}" != *"CN=TWCA SSL Certification Authority"* ]] || \
             [[ "${SUBJECT}" != *"O=TAIWAN-CA"* ]] || \
             [[ "${ISSUER}" != *"CN=TWCA CYBER Root CA"* ]]; then
            echo "::warning::TWCA issuer identity/fingerprint mismatch; refusing to trust it."
            exit 0
          fi

          sudo cp /tmp/tpex-issuer.pem /usr/local/share/ca-certificates/twca-tpex-ssl-ca.crt
          sudo update-ca-certificates
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

          if python - <<'PY'
          import urllib.request
          with urllib.request.urlopen(
              "https://www.tpex.org.tw/openapi/v1/tpex_daily_trading_index",
              timeout=20,
          ) as r:
              print("TPEx TLS repaired:", r.status)
          PY
          then
            echo "TPEx certificate repair succeeded."
          else
            echo "::warning::TPEx TLS still unavailable; continuing with last valid TPEx data."
          fi

      - name: Decide update mode
        id: mode
        shell: bash
        run: |
          MODE="deploy-only"
          MARKET_KIND="afterhours"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.update_kind }}"
          elif [[ "${{ github.event.schedule }}" == "30 0 * * 1-5" ]]; then
            MODE="premarket"
          elif [[ "${{ github.event.schedule }}" == "7 1-5 * * 1-5" ]]; then
            MODE="intraday"
          elif [[ "${{ github.event.schedule }}" == "0 12 * * 0" ]]; then
            MODE="weekly"
          else
            MODE="afterhours"
          fi

          if [[ "$MODE" == "intraday" ]]; then
            MARKET_KIND="intraday"
          else
            MARKET_KIND="afterhours"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "market_kind=$MARKET_KIND" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE / Market kind: $MARKET_KIND"

      - name: Fetch official Taiwan market data
        if: steps.mode.outputs.mode != 'deploy-only'
        working-directory: automation
        run: python fetch_market.py --kind "${{ steps.mode.outputs.market_kind }}"

      - name: Fetch global macro and official news
        if: steps.mode.outputs.mode != 'deploy-only'
        run: python automation/fetch_global.py

      - name: Build automatic daily and weekly brief
        run: python automation/build_brief.py

      - name: Validate static research data
        run: npm run check

      - name: Validate live Taiwan data
        run: python automation/validate_live.py

      - name: Validate global macro and official news
        run: python automation/validate_global.py

      - name: Prune historical snapshots
        if: steps.mode.outputs.mode != 'deploy-only'
        run: python automation/prune_history.py

      - name: Build system health status
        run: python automation/build_health.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Save generated data to repository
        if: steps.mode.outputs.mode != 'deploy-only'
        shell: bash
        run: |
          git config user.name "tw-market-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/live-history.json data/auto-brief.json data/global.json data/system-health.json history/
          if git diff --cached --quiet; then
            echo "No generated-data changes to commit."
          else
            git commit -m "chore: automated market update [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TW Market Radar automation"
            echo "- Mode: ${{ steps.mode.outputs.mode }}"
            echo "- Market kind: ${{ steps.mode.outputs.market_kind }}"
            echo "- Repository: ${{ github.repository }}"
            echo "- Run: ${{ github.run_number }}"
            if [[ -f data/system-health.json ]]; then
              echo "- System health file: generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
